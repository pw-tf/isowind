name: Android

on:
  # Branches only: tags (like the bundled-mods release's) don't build
  push:
    branches: ['**']
  workflow_dispatch:

# A newer push replaces a run still going
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # The NDK, the dependencies and their builds need more room than the runner leaves free
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake python3 wget unzip bzip2 pkg-config gettext-base autoconf \
            automake libtool patch nasm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The NDK, downloaded sources and built dependencies (the engine itself is always rebuilt). Saved after every
      # run, failed or not, so a failing engine build doesn't cost the hour the libraries take.
      - uses: actions/cache/restore@v4
        with:
          path: |
            android/buildscripts/downloads
            android/buildscripts/toolchain
            android/buildscripts/prefix
            android/buildscripts/build
            !android/buildscripts/build/arm64/openmw-prefix
          key: android-deps-${{ github.run_id }}
          restore-keys: android-deps-

      # The bundled mods (third-party, so not in git): bundled-mods.zip on this repository's "bundled-mods" release
      - name: Bundled mods
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download bundled-mods -p bundled-mods.zip; then
            unzip -q bundled-mods.zip -d bundled-mods
          else
            echo "::warning::No bundled-mods release: the APK goes without the bundled mods"
          fi

      - name: Engine and libraries (arm64)
        env:
          ISOWIND_MODS: ${{ github.workspace }}/bundled-mods
          # Report every file that fails, not just the first
          MAKEFLAGS: -k
        run: |
          rm -rf android/buildscripts/build/arm64/openmw-prefix
          cd android/buildscripts && ./build.sh --arch arm64

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            android/buildscripts/downloads
            android/buildscripts/toolchain
            android/buildscripts/prefix
            android/buildscripts/build
            !android/buildscripts/build/arm64/openmw-prefix
          key: android-deps-${{ github.run_id }}

      - name: APK
        run: cd android && ./gradlew --no-daemon assembleMainlineDebug

      - uses: actions/upload-artifact@v4
        with:
          name: isowind-android-arm64
          path: android/app/build/outputs/apk/mainline/debug/*.apk
