name: Linux

on:
  # Branches only: tags (like the bundled-mods release's) don't build
  push:
    branches: ['**']
  workflow_dispatch:

# A newer push replaces a run still going
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic

      # The compiler cache, saved after every run, failed or not, so a failing build doesn't start over next time
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: linux-ccache-${{ github.run_id }}
          restore-keys: linux-ccache-

      # The multiplayer's networking (TES3MP's CrabNet), at the commit the Windows build uses
      - name: CrabNet
        run: |
          git clone https://github.com/TES3MP/CrabNet.git crabnet
          git -C crabnet checkout 19e6619
          # Newer compilers don't pull in <cstdint> for it
          sed -i '1i #include <cstdint>' crabnet/Source/Utils/_FindFirst.h
          cmake -S crabnet -B crabnet/build -DCMAKE_BUILD_TYPE=Release -DCRABNET_ENABLE_DLL=OFF \
            -DCRABNET_ENABLE_SAMPLES=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build crabnet/build -j$(nproc)

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold \
            -DUSE_SYSTEM_TINYXML=ON -DOPENMW_USE_SYSTEM_RECASTNAVIGATION=ON \
            -DBUILD_OPENCS=OFF -DBUILD_BSATOOL=OFF -DBUILD_ESMTOOL=OFF -DBUILD_ESSIMPORTER=OFF -DBUILD_NIFTEST=OFF \
            -DBUILD_NAVMESHTOOL=OFF -DBUILD_BULLETOBJECTTOOL=OFF -DBUILD_LAUNCHER=OFF -DBUILD_WIZARD=OFF \
            -DRakNet_INCLUDES=$PWD/crabnet/include \
            -DRakNet_LIBRARY_RELEASE=$(find $PWD/crabnet/build -name 'libRakNetLibStatic.a' | head -1) \
            -DRakNet_LIBRARY_DEBUG=$(find $PWD/crabnet/build -name 'libRakNetLibStatic.a' | head -1)

      - name: Build
        # -k: report every file that fails, not just the first
        run: cmake --build build -j$(nproc) -- -k

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: linux-ccache-${{ github.run_id }}

      # The bundled mods (third-party, so not in git): bundled-mods.zip on this repository's "bundled-mods" release
      - name: Bundled mods
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download bundled-mods -p bundled-mods.zip; then
            unzip -q bundled-mods.zip -d bundled-mods
          else
            echo "::warning::No bundled-mods release: the package goes without the bundled mods"
          fi

      # Laid out like the Windows zip, with isowind.sh in place of Isowind.exe
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo wget -q -O /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy
          sh isowind/linux/package.sh build Isowind bundled-mods
          tar -czf isowind-linux-x86_64.tar.gz Isowind

      - uses: actions/upload-artifact@v4
        with:
          name: isowind-linux-x86_64
          path: isowind-linux-x86_64.tar.gz
