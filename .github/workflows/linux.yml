name: Linux

# The Linux package for a release, put on the release beside the Windows zip. release.yml runs it for every release;
# by hand (Actions > Linux > Run workflow, or gh workflow run linux.yml -f tag=TAG) it fills in one made before that,
# building the release's tag, or another commit given as ref, whichever branch it is run from.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag
        required: true
      ref:
        description: "The commit, branch or tag to build (blank: the release's tag)"
        required: false
        default: ''
      version_hash:
        description: >-
          Multiplayer version hash to build in, when the release's Windows zip was built from other engine source than
          this (line 2 of its engine/resources/version). Blank: the source's own
        required: false
        default: ''
      attach:
        description: Put the package on the release (unticked, it is this run's artifact for a week)
        type: boolean
        default: true
      match_windows:
        description: Stop if the release's Windows zip has another multiplayer version hash
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      ref:
        type: string
        default: ''
      version_hash:
        type: string
        default: ''
      attach:
        type: boolean
        default: true
      # Whether to check the hash against the release's Windows zip (release.yml compares the two builds itself)
      match_windows:
        type: boolean
        default: true
    outputs:
      hash:
        description: The multiplayer version hash it was built with
        value: ${{ jobs.build.outputs.hash }}
      glibc:
        description: The oldest glibc the package runs on (e.g. 2.39)
        value: ${{ jobs.build.outputs.glibc }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # A newer run for the same release replaces one still going
    concurrency:
      group: linux-${{ inputs.tag }}
      cancel-in-progress: true
    # (to put the package on the release)
    permissions:
      contents: write
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      glibc: ${{ steps.archive.outputs.glibc }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      TAG: ${{ inputs.tag }}
      VERSION_HASH: ${{ inputs.version_hash }}
      ATTACH: ${{ inputs.attach }}
      MATCH_WINDOWS: ${{ inputs.match_windows }}
      # The multiplayer's networking (TES3MP's CrabNet), at the commit the Windows build uses (quoted: unquoted, YAML
      # reads 19e6619 as a number, 19 x 10^6619)
      CRABNET_COMMIT: '19e6619'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false

      # The hash given, in place of the one cmake/GitVersion.cmake makes from the engine's source. That script runs at
      # build time, so changing it here is enough (the source patch in the package is the source's, unchanged)
      - name: Version hash
        if: inputs.version_hash != ''
        run: |
          printf '%s\n' "$VERSION_HASH" | grep -Eqx '[0-9a-f]{40}' \
            || { echo "::error::version_hash isn't a 40-digit hash"; exit 1; }
          sed -i "s/^string(SHA1 COMMITHASH .*/set(COMMITHASH \"$VERSION_HASH\")/" cmake/GitVersion.cmake
          grep -qF "set(COMMITHASH \"$VERSION_HASH\")" cmake/GitVersion.cmake \
            || { echo "::error::no hash line to replace in cmake/GitVersion.cmake"; exit 1; }

      - name: Dependencies
        run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic

      # The compiler cache, saved after every run, failed or not, so a failing build doesn't start over next time
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: linux-ccache-${{ github.run_id }}
          restore-keys: linux-ccache-

      - name: CrabNet
        run: |
          git clone https://github.com/TES3MP/CrabNet.git crabnet
          git -C crabnet checkout "$CRABNET_COMMIT"
          # Newer compilers don't pull in <cstdint> for it
          sed -i '1i #include <cstdint>' crabnet/Source/Utils/_FindFirst.h
          cmake -S crabnet -B crabnet/build -DCMAKE_BUILD_TYPE=Release -DCRABNET_ENABLE_DLL=OFF \
            -DCRABNET_ENABLE_SAMPLES=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build crabnet/build -j"$(nproc)"

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold \
            -DUSE_SYSTEM_TINYXML=ON -DOPENMW_USE_SYSTEM_RECASTNAVIGATION=ON \
            -DBUILD_OPENCS=OFF -DBUILD_BSATOOL=OFF -DBUILD_ESMTOOL=OFF -DBUILD_ESSIMPORTER=OFF -DBUILD_NIFTEST=OFF \
            -DBUILD_NAVMESHTOOL=OFF -DBUILD_BULLETOBJECTTOOL=OFF -DBUILD_LAUNCHER=OFF -DBUILD_WIZARD=OFF \
            -DRakNet_INCLUDES="$PWD/crabnet/include" \
            -DRakNet_LIBRARY_RELEASE="$(find "$PWD/crabnet/build" -name 'libRakNetLibStatic.a' | head -1)" \
            -DRakNet_LIBRARY_DEBUG="$(find "$PWD/crabnet/build" -name 'libRakNetLibStatic.a' | head -1)"

      - name: Build
        # -k: report every file that fails, not just the first
        run: cmake --build build -j"$(nproc)" -- -k

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: linux-ccache-${{ github.run_id }}

      # A server lets in only players with its own hash: this build's has to be the one asked for, and the Windows
      # zip's on the release, or the two wouldn't play together
      - name: Check version hash
        id: hash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          HASH=$(sed -n 2p build/resources/version)
          echo "Version hash: $HASH"
          for f in build/openmw build/tes3mp-server; do
            grep -qaF "$HASH" "$f" || { echo "::error::$f wasn't built with $HASH"; exit 1; }
          done
          if [ -n "$VERSION_HASH" ] && [ "$HASH" != "$VERSION_HASH" ]; then
            echo "::error::built with $HASH, not the $VERSION_HASH asked for"; exit 1
          fi
          if [ "$MATCH_WINDOWS" = true ] &&
            gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx Isowind.zip; then
            gh release download "$TAG" -p Isowind.zip -D "$RUNNER_TEMP/windows" --clobber
            WINDOWS=$(unzip -p "$RUNNER_TEMP/windows/Isowind.zip" Isowind/engine/resources/version | sed -n 2p | tr -d '\r')
            if [ "$HASH" != "$WINDOWS" ]; then
              MESSAGE="the release's Windows zip has version hash $WINDOWS and this build $HASH, so they wouldn't play"
              MESSAGE="$MESSAGE together. If the zip's engine is the tag's but for changes that don't touch the"
              MESSAGE="$MESSAGE multiplayer, run again with version_hash $WINDOWS"
              if [ "$ATTACH" = true ]; then echo "::error::$MESSAGE"; exit 1; fi
              echo "::warning::$MESSAGE"
            fi
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Multiplayer version hash: \`$HASH\`" >> "$GITHUB_STEP_SUMMARY"

      # Laid out like the Windows zip, with isowind.sh in place of Isowind.exe, and like the released one without the
      # bundled mods (their licences don't all allow passing them on)
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo wget -q -O /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy
          sh isowind/linux/package.sh --no-mods build Isowind

      # Source, as make_package.ps1 puts it in the Windows zip (OpenMW is GPL v3): the changes against OpenMW's
      # openmw-0.51.0 tag, fetched on its own from OpenMW's GitLab, with the same folders left out (and android/, which
      # tags from before its removal have and their Windows patch left out)
      - name: Source
        run: |
          OPENMW_TAG=openmw-0.51.0
          git fetch --depth 1 https://gitlab.com/OpenMW/openmw.git "refs/tags/$OPENMW_TAG:refs/tags/$OPENMW_TAG"
          mkdir -p Isowind/source
          git diff "$OPENMW_TAG" HEAD -- . ':!MSVC2022_64' ':!deps' ':!android' ':!isowind' ':!.github' \
            > "Isowind/source/isowind-$OPENMW_TAG.patch"
          cp isowind/tools/make_palettes.py isowind/tools/retro_textures.py Isowind/source/
          cat > Isowind/source/README.txt <<EOF
          Isowind source
          ==============
          isowind-$OPENMW_TAG.patch   Changes to OpenMW: apply to https://gitlab.com/OpenMW/openmw at tag $OPENMW_TAG.
                                        Includes the multiplayer port of TES3MP (https://github.com/TES3MP/TES3MP, GPL v3).
          make_palettes.py              Builds pixelart/textures/isowind/palettes.dds.
          retro_textures.py             Builds the pixel art look's textures (isowind.sh runs the copy in tools).
          The top-down mod (Lua) and shaders are in the mod and pixelart folders as they are, and the launcher
          (isowind.sh, isowind-launcher.py) beside this folder. All of Isowind at this version:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$(git rev-parse HEAD)
          The engine was built on Ubuntu 24.04 with CrabNet (https://github.com/TES3MP/CrabNet) at commit $CRABNET_COMMIT.
          EOF
          if [ -n "$VERSION_HASH" ]; then
            printf '%s\n%s\n' "Its multiplayer version hash was set to the Windows build's, $VERSION_HASH," \
              "in place of the one cmake/GitVersion.cmake makes from the source." >> Isowind/source/README.txt
          fi

      - name: Archive
        id: archive
        run: |
          tar -czf isowind-linux-x86_64.tar.gz Isowind
          # The oldest glibc it runs on, for the release notes: the newest its programs and libraries ask for
          # (linuxdeploy leaves glibc to the system)
          GLIBC=$({ find Isowind/engine/usr/bin -maxdepth 1 -type f; find Isowind/engine/usr/lib -type f; } |
            xargs objdump -T 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "Needs ${GLIBC:-an unknown glibc} or newer" >> "$GITHUB_STEP_SUMMARY"
          echo "glibc=${GLIBC#GLIBC_}" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        if: inputs.attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" isowind-linux-x86_64.tar.gz --clobber

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.attach }}
        with:
          name: isowind-linux-x86_64
          path: isowind-linux-x86_64.tar.gz
          retention-days: 7
