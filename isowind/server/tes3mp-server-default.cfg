[General]
# The address to listen on (0.0.0.0: every network) and the port; the host's router needs UDP forwarded to it (see
# README.txt), the players' routers don't.
localAddress = 0.0.0.0
port = 25565
maximumPlayers = 16
hostname = Isowind server
# 0 verbose, 1 info, 2 warnings, 3 errors
logLevel = 1
# Leave empty for no password; players then type it at login
password =

[Isowind]
# Isowind.exe's "Host a server" (or "isowind.sh host") puts your choices in tes3mp-server.cfg, over these.
# coop: one shared world, as in single player. mmo: everyone loots and quests for themselves, and enemies respawn
mode = coop
# Whether players can hurt each other
pvp = false
# -100 (very easy) to 100 (very hard); 0 is Morrowind's normal
difficulty = 0
# MMO: how much faster than normal enemies come back (normal: 1.5 minutes for the weakest to 60 for bosses)
respawnSpeed = 1
# How much faster than Morrowind's the time of day goes (Morrowind's: an hour in 2 minutes)
timeSpeed = 1

[Plugins]
home = ./CoreScripts
plugins = serverCore.lua

[MasterServer]
enabled = false
address = master.tes3mp.com
port = 25561
rate = 10000
