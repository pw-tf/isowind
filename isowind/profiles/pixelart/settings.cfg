# Isowind - pixel art look. Changes made in the game's Options are saved here.
# Anything not set here comes from Documents\My Games\OpenMW\settings.cfg, then OpenMW's defaults.

[General]
anisotropy = 0
texture mag filter = nearest
texture min filter = nearest
texture mipmap = nearest

[Video]
# The shader pack tonemaps: no gamma or interior brightness hacks
gamma = 1.0
# Each scene pixel is a 3x3 block of screen pixels.
pixel art scale = 3
pixel art stabilization = true
# Stop-motion animation for actors further than ~11 m away.
pixel art animation fps = 12
pixel art animation near distance = 768

[Shaders]
minimum interior brightness = 0.0
force per pixel lighting = true
light bands = 1

[Shadows]
enable shadows = true
actor shadows = true
player shadows = true
terrain shadows = true
object shadows = true
# 1 = no filtering: hard-edged shadows.
percentage closer filtering = 1

[Game]
# Crossfade between animations, so leg switches (forward / strafe / back) blend instead of snapping.
smooth animation transitions = true
# Move at the game's speed in every direction instead of following each clip's own (uneven) motion.
player movement ignores animation = true
# Running is the default (Shift walks) and costs no fatigue.
player running costs fatigue = false
# Weapon Sheathing: lowered weapons stay on the hip or back
weapon sheathing = true
use additional anim sources = true

[Post Processing]
# Rafael's Shader Pack: ambient occlusion, sky and volumetrics, god rays, diffuse lighting, wet world (water
# reflections too) and tonemapping (no anti-aliasing: it would only blur the pixels). The top-down selection ring is added by Lua.
enabled = true
chain = HBAO,VAIO,godrays,DIVE,wetworld,tonemap

[GUI]
# Options > Interface: 'HUD size' scales only the in-game HUD, 'Menu and text size' everything.
scaling factor = 1.0
hud scaling factor = 1.5

[Terrain]
# Isowind: nearby objects stay separate, so the top-down camera can fade each one that hides the player
object paging active grid = false

[Navigator]
# Isowind: build the navigation mesh around new cells faster
async nav mesh updater threads = 2

[Water]
# Reflect only the sky: the shader pack's wetworld does the rest (much faster)
reflection detail = 0
