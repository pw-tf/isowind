settings_page: "Isowind"
settings_page_desc: "Isowind's own options."
settings_multiplayer: "Multiplayer"
settings_player_names: "Show player names"
settings_player_names_desc: "Always show the other players' names over them."
settings_controls: "Controls"
switch_view: "Switch view"
switch_view_desc: "Top-down, then third person, then first person."
switch_view_key_desc: "Top-down, then third person, then first person (F7 unless changed). Click it (or A on it), then press a key or button."
switch_view_button_desc: "A second binding, for a controller button. Move onto it with the D-pad and press A (or click it), then press the button."
move_mode: "Movement"
move_mode_desc: "WASD moves the character relative to the screen. Click to move: right click on the ground runs there (hold to keep steering), and on a person or a thing walks up to it and uses it; it never attacks. Left click attacks and casts where you stand, and Shift held keeps you standing still. WASD and the controller move in both."
move_wasd: "WASD"
move_click: "Click to move"
move_button: "Click to move button"
move_button_desc: "Right: right click moves and uses things, and left click attacks and uses things where you stand (the power attack is then only on the controller's left trigger). Left: left click moves, uses things, and walks up to enemies to attack them, Shift and left click attacks where you stand, and the right button power attacks."
move_button_right: "Right"
move_button_left: "Left"
camera_rotation: "Camera rotation"
camera_rotation_desc: "Turn the top-down view: hold the middle mouse button and move the mouse, or with click to move the left and right arrow keys; on a controller, hold the D-pad left or right."
move_prompt_title: "How would you like to move?"
move_prompt_wasd: "WASD to move"
move_prompt_wasd_desc: "Move with W, A, S and D. The mouse aims, and left click attacks or uses what is under it. (1)"
move_prompt_click: "Click to move"
move_prompt_click_desc: "Right click where to go, or on people and things to walk up and use them. Left click attacks. (2)"
move_prompt_later: "This can be changed in Options -> Scripts -> Isowind."
